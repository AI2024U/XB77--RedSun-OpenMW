name: Public source safeguards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository for common private files and markers
        shell: bash
        run: |
          python3 ci/public_audit.py
      - name: Prevent release claims while source is incomplete
        shell: bash
        run: |
          test -f docs/RELEASE_CHECKLIST.md
          test -f CODE_SIGNING_POLICY.md
          test -f PRIVACY.md
          test -f LICENSE
          echo 'This workflow checks source hygiene. It does not build or sign executables.'
